name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.8"
      - name: Run tests
        run: python3 -m unittest discover -s tests -v
      - name: Prepare release files
        run: |
          mkdir -p dist
          cp pingflow install.sh dist/
          chmod 0755 dist/pingflow dist/install.sh
          cd dist
          sha256sum pingflow install.sh > SHA256SUMS
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            dist/pingflow \
            dist/install.sh \
            dist/SHA256SUMS \
            --generate-notes \
            --title "PingFlow TCP ${GITHUB_REF_NAME}"
